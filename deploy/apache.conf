# Exemplo: ajuste o caminho conforme a instalação. Configure Listen 8080 em ports.conf
# somente se ainda não existir. Requer PHP habilitado no Apache.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/sisc-atualizado
    DirectoryIndex index.php
    <Directory /var/www/html/sisc-atualizado>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /var/www/html/sisc-atualizado/backend>
        Require all denied
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/condoconnect-error.log
    CustomLog ${APACHE_LOG_DIR}/condoconnect-access.log combined
</VirtualHost>
