# Exemplo para o servidor de teste: site em http://2.24.65.149:8080/sisc-test,
# arquivos em /var/www/html/sisc-test. Copie para /etc/apache2/sites-available/condoconnect.conf,
# ative com "sudo a2ensite condoconnect && sudo a2enmod rewrite && sudo systemctl restart apache2".
# Acrescente "Listen 8080" em /etc/apache2/ports.conf somente se ainda não existir.
# Requer PHP no Apache (pacote libapache2-mod-php).
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html/sisc-test>
        Options -Indexes
        # Sem "AllowOverride All" o .htaccess é ignorado e o .env (com a senha do banco) fica exposto.
        AllowOverride All
        Require all granted
    </Directory>
    # Proteção extra, mesmo que o .htaccess deixe de ser lido.
    <Directory /var/www/html/sisc-test/backend>
        Require all denied
    </Directory>
    <Directory /var/www/html/sisc-test/tools>
        Require all denied
    </Directory>
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/condoconnect-error.log
    CustomLog ${APACHE_LOG_DIR}/condoconnect-access.log combined
</VirtualHost>
