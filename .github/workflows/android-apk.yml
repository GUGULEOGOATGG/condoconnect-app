name: Android APK

# Gera o APK do CondoConnect (pasta mobile/) sem precisar de computador com Android Studio.
# No GitHub: aba Actions > "Android APK" > Run workflow. Ao terminar, o APK fica em Releases > "CondoConnect APK de teste".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'api/mobile.php', '.github/workflows/android-apk.yml']

# "write" só para publicar o APK em Releases.
permissions:
  contents: write

jobs:
  apk:
    name: Testes e APK de 64 bits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # A checagem de tipos avisa, mas não impede a geração do APK.
      - run: npm run typecheck
        continue-on-error: true
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Compilar o APK
        working-directory: mobile/android
        # APK de teste: mesmos valores de mobile/.env. Remova os dois quando o servidor tiver HTTPS.
        env:
          EXPO_PUBLIC_API_BASE_URL: http://2.24.65.149:8080/sisc-test
          EXPO_PUBLIC_ALLOW_HTTP: '1'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: condoconnect-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # A release "apk-teste" não é apagada: só o arquivo do APK é trocado (o link continua o mesmo)
      # e a tag passa a apontar para este commit. Na primeira vez, a release é criada.
      # Link direto: https://github.com/<dono>/<repositório>/releases/download/apk-teste/CondoConnect-teste.apk
      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/CondoConnect-teste.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          notes="APK de teste (Android 7+, 64 bits), ligado a http://2.24.65.149:8080/sisc-test. Conexão sem criptografia: não distribuir para moradores.

          Versão $(grep -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2), commit ${GITHUB_SHA::7}, gerado em $(date -u '+%d/%m/%Y %H:%M') UTC.
          SHA-256 do APK: $(sha256sum "$apk" | cut -d' ' -f1)"
          if gh release view apk-teste > /dev/null 2>&1; then
            git tag -f apk-teste "$GITHUB_SHA"
            git push -f origin refs/tags/apk-teste
            gh release upload apk-teste "$apk" --clobber
            gh release edit apk-teste --title "CondoConnect APK de teste" --notes "$notes"
          else
            gh release create apk-teste "$apk" --target "$GITHUB_SHA" --title "CondoConnect APK de teste" --notes "$notes"
          fi
          echo "Link direto: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/apk-teste/CondoConnect-teste.apk" >> "$GITHUB_STEP_SUMMARY"
