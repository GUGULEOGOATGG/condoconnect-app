name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Syntax, tests and coverage
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: sisc_test_password
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_NAME: sisc_test
      TEST_DB_USER: root
      TEST_DB_PASS: sisc_test_password
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo, curl, openssl, dom
          coverage: xdebug
          # O xdebug desliga o JIT do opcache e o PHP avisa "JIT is incompatible with third party
          # extensions" em cada processo. O aviso caía no log do servidor PHP dos testes HTTP e
          # reprovava o phpunit. O JIT não é usado nos testes: fica desligado aqui (e nos
          # processos filhos, que leem o mesmo php.ini). O xdebug continua medindo a cobertura.
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
          tools: phpunit:10.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Conferir que o PHP inicia sem avisos
        run: |
          php -v
          startup="$(php -r '' 2>&1)"
          if [ -n "$startup" ]; then echo "O PHP imprimiu avisos ao iniciar:"; echo "$startup"; exit 1; fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:coverage
      - run: phpunit
      - run: php tools/check-coverage.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
      - uses: SonarSource/sonarqube-scan-action@v6
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
